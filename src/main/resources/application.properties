spring.application.name=bibliotech-api
server.port=8080

# --- Perfil por defecto: H2 en memoria (no requiere instalar nada) ---
spring.datasource.url=jdbc:h2:mem:bibliotech;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Para usar PostgreSQL en produccion, comenta el bloque H2 de arriba
# --- y descomenta esto (o crea application-prod.properties) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/bibliotech
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=cambia_este_valor_por_un_secreto_largo_de_al_menos_32_caracteres
jwt.expiration-ms=604800000

springdoc.swagger-ui.path=/swagger-ui.html
